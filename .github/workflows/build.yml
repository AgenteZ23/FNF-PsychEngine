name: Build Windows Game
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.2

      - name: Install Haxelib Packages
        run: |
          haxelib install lime 8.1.2 --never
          haxelib install openfl 9.3.3 --never
          haxelib install flixel 5.6.1 --never
          haxelib install flixel-addons 3.2.2 --never
          haxelib install flixel-tools 1.5.1 --never
          haxelib install flixel-ui 2.5.0 --never
          haxelib install hscript 2.5.0 --never
          haxelib install hscript-iris 1.1.3 --never
          haxelib install tjson 1.4.0 --never
          haxelib install hxdiscord_rpc 1.2.4 --never

      - name: Install Git Libraries
        run: |
          haxelib git SScript https://github.com/YoshiCrafter29/SScript
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec
          haxelib git hxdiscord https://github.com/MA3A/hxdiscord
          haxelib git hscript-ex https://github.com/ianhatcher/hscript-ex
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib run lime setup -y

      - name: Patch Outdated Source Code
        run: |
          python -c "
          import os, re
          def p(file, old, new):
              if os.path.exists(file):
                  with open(file, 'r', encoding='utf-8') as f: c = f.read()
                  c = re.sub(old, new, c)
                  with open(file, 'w', encoding='utf-8') as f: f.write(c)

          # 1. Arregla PlayState borrando el e.cancel()
          p('source/states/PlayState.hx', r'e\.cancel\(\);', r'// e.cancel();')
          p('source/states/PlayState.hx', r'onClose\.add\(function\(e\)', r'onClose.add(function()')
          
          # 2. Actualiza los códigos viejos de Tankman a la sintaxis nueva de FlxAnimate
          p('source/states/stages/objects/SpraycanAtlasSprite.hx', r'\.onComplete\.add\(([^)]+)\)', r'.onComplete = \1')
          p('source/states/stages/Tank.hx', r'\.onComplete\.add\(([^)]+)\)', r'.onComplete = \1')
          p('source/states/stages/Tank.hx', r'\.onComplete\.remove\(([^)]+)\)', r'.onComplete = null')
          p('source/states/stages/Tank.hx', r'\.onComplete\.has\(([^)]+)\)', r'.onComplete != null')
          
          # 3. Omite la función eliminada fromSpriteMap
          p('source/flxanimate/PsychFlxAnimate.hx', r'frames = FlxAnimateFrames\.fromSpriteMap\(cast myData, img\);', r'frames = null; /* parcheado */')
          "

      - name: Build Game
        run: haxelib run lime build windows -release

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNF-PsychEngine-Windows
          path: export/release/windows/bin/
