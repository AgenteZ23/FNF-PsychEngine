name: Build Windows Game
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.2

      - name: Install All Dependencies
        shell: bash
        run: |
          echo "Instalando librerías en segundo plano..."
          haxelib install lime 8.1.2 --never > /dev/null
          haxelib install openfl 9.3.3 --never > /dev/null
          haxelib install flixel 5.6.1 --never > /dev/null
          haxelib install flixel-addons 3.2.2 --never > /dev/null
          haxelib install flixel-tools 1.5.1 --never > /dev/null
          haxelib install flixel-ui 2.5.0 --never > /dev/null
          haxelib install hscript 2.5.0 --never > /dev/null
          haxelib install hscript-iris 1.1.3 --never > /dev/null
          haxelib install tjson 1.4.0 --never > /dev/null
          haxelib install SScript 5.2.0 --never > /dev/null
          haxelib install hxdiscord_rpc 1.2.4 --never > /dev/null
          haxelib git flxanimate https://github.com/DotNetRetard/flxanimate > /dev/null
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit > /dev/null
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec > /dev/null
          haxelib git hxdiscord https://github.com/MA3A/hxdiscord > /dev/null
          haxelib git hscript-ex https://github.com/ianhatcher/hscript-ex > /dev/null
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc > /dev/null
          haxelib run lime setup -y > /dev/null
          echo "¡Librerías completadas! Iniciando compilación..."

      - name: Build Game
        run: haxelib run lime build windows -release

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNF-PsychEngine-Windows
          path: export/release/windows/bin/
